name: Bug report
description: Report a reproducible defect in the infrastructure or experiments
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command and relevant profile or configuration.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit
      description: The full Git commit hash.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, SimGrid/IRIS version, model precision, and execution mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
